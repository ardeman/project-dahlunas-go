name: Checks

# Pushes to main that change the service run these checks inside Deploy
# instead, so a run's workflow name shows whether it deployed.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'public/**'
      - '.github/**'
      - LICENSE
      - firebase.json
      - .gitignore
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting, vet, and tests
        run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
